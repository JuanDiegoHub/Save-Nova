{% extends 'menu/menu.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'pedido/css/detalle_pedido.css' %}">

<div class="detalle-pedido">

<h1 class="titulo-detalle">Pedido de {{ pedido.cliente.nombre }}</h1>

<form style="display:none">
{% csrf_token %}
</form>

<div class="acciones-pedido">

<button class="btn-agregar" onclick="agregarProducto()">
<i class="fa fa-plus"></i> Agregar Producto
</button>

<button class="btn-agregar" onclick="guardarPedido()">
<i class="fa fa-save"></i> Guardar Pedido
</button>

<button class="btn-cancelar" onclick="cancelarPedido({{ pedido.id_pedido }})">
<i class="fa fa-times"></i> Cancelar Pedido
</button>

</div>

<table class="tabla-pedido">

<thead>
<tr>
<th>Producto</th>
<th>Cantidad</th>
<th>Valor Unitario</th>
<th>Total</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaProductos">

{% for d in detalles %}
<tr id="fila-{{ d.id }}">

<td>
<input type="text" class="input-nombre" value="{{ d.nombre_producto }}">
</td>

<td>
<input type="number"
class="input-cantidad"
value="{{ d.cantidad }}"
oninput="recalcular({{ d.id }})">
</td>

<td>
<input type="number"
step="0.01"
class="input-precio"
value="{{ d.precio|floatformat:2 }}"
oninput="recalcular({{ d.id }})">
</td>

<td class="subtotal" id="subtotal-{{ d.id }}">
${{ d.subtotal }}
</td>

<td>
<button class="btn-eliminar" onclick="eliminarProducto({{ d.id }})">
<i class="fa fa-trash"></i>
</button>
</td>

</tr>
{% endfor %}

</tbody>

<tfoot>

<tr class="total-row">
<td colspan="3"><strong>Total Pedido</strong></td>
<td colspan="2"><strong id="totalPedido">${{ total }}</strong></td>
</tr>

</tfoot>

</table>

</div>

<!-- VARIABLES PARA JAVASCRIPT -->
<script>

const pedidoId = "{{ pedido.id_pedido }}"
const csrfToken = "{{ csrf_token }}"

</script>

<script src="{% static 'pedido/js/detalle_pedido.js' %}"></script>

{% endblock %}
