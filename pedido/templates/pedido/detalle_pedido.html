{% extends 'menu/menu.html' %}
{% load static %}
{% block content %}

<div class="detalle-pedido">

<h1 class="titulo-detalle">Pedido de {{ pedido.cliente.nombre }}</h1>

<form style="display:none">
{% csrf_token %}
</form>

<div class="acciones-pedido">

<button class="btn-agregar" onclick="agregarProducto()">
<i class="fa fa-plus"></i> Agregar Producto
</button>

</div>

<table class="tabla-pedido">

<thead>
<tr>
<th>Producto</th>
<th>Cantidad</th>
<th>Valor Unitario</th>
<th>Total</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tablaProductos">

{% for d in detalles %}
<tr id="fila-{{ d.id }}">

<td>
<input type="text" class="input-nombre" value="{{ d.nombre_producto }}">
</td>

<td>
<input type="number" class="input-cantidad" value="{{ d.cantidad }}" oninput="recalcular({{ d.id }})">
</td>

<td>
<input type="number" step="0.01" class="input-precio" value="{{ d.precio|floatformat:2 }}" oninput="recalcular({{ d.id }})">
</td>

<td class="subtotal" id="subtotal-{{ d.id }}">
${{ d.subtotal }}
</td>

<td>
<button class="btn-eliminar" onclick="eliminarProducto({{ d.id }})">
<i class="fa fa-trash"></i>
</button>
</td>

</tr>
{% endfor %}

</tbody>

<tfoot>

<tr class="total-row">
<td colspan="3"><strong>Total Pedido</strong></td>
<td colspan="2"><strong id="totalPedido">${{ total }}</strong></td>
</tr>

</tfoot>

</table>

<div style="margin-top:20px">
<button class="btn-guardar-pedido" onclick="guardarPedido()">
<i class="fa fa-save"></i> Guardar Pedido
</button>
</div>

</div>


<style>

.acciones-pedido{
margin-bottom:15px;
}

.btn-agregar{
background:#2ecc71;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-eliminar{
background:#e74c3c;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.btn-guardar-pedido{
background:#27ae60;
color:white;
border:none;
padding:12px 18px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

input{
padding:6px;
border:1px solid #ccc;
border-radius:5px;
width:90%;
}

</style>


<script>

let contadorNuevo = 0
let temporizadores = {}

function agregarProducto(){

contadorNuevo++

let tabla = document.querySelector("#tablaProductos")

let fila = document.createElement("tr")

fila.classList.add("producto-nuevo")

fila.innerHTML = `
<td>
<input type="text" class="input-nombre">
</td>

<td>
<input type="number" class="input-cantidad" value="1" oninput="recalcularNuevo(${contadorNuevo})">
</td>

<td>
<input type="number" class="input-precio" value="0" oninput="recalcularNuevo(${contadorNuevo})">
</td>

<td class="subtotal" id="subtotal-nuevo-${contadorNuevo}">
$0
</td>

<td>
<button class="btn-eliminar" onclick="this.closest('tr').remove(); recalcularTotal();">
<i class="fa fa-trash"></i>
</button>
</td>
`

tabla.appendChild(fila)

}


function recalcular(id){

let fila = document.querySelector("#fila-"+id)

let cantidad = parseFloat(fila.querySelector(".input-cantidad").value) || 0
let precio = parseFloat(fila.querySelector(".input-precio").value) || 0

let subtotal = cantidad * precio

document.querySelector("#subtotal-"+id).innerText="$"+subtotal.toFixed(2)

recalcularTotal()

guardarAutomatico(id)

}


function recalcularNuevo(id){

let fila = document.querySelector("#subtotal-nuevo-"+id).closest("tr")

let cantidad = parseFloat(fila.querySelector(".input-cantidad").value) || 0
let precio = parseFloat(fila.querySelector(".input-precio").value) || 0

let subtotal = cantidad * precio

document.querySelector("#subtotal-nuevo-"+id).innerText="$"+subtotal.toFixed(2)

recalcularTotal()

}


function recalcularTotal(){

let subtotales = document.querySelectorAll(".subtotal")

let total = 0

subtotales.forEach(function(td){

let valor = td.innerText.replace("$","")

total += parseFloat(valor) || 0

})

document.querySelector("#totalPedido").innerText="$"+total.toFixed(2)

}


function guardarAutomatico(id){

clearTimeout(temporizadores[id])

temporizadores[id] = setTimeout(function(){

let fila = document.querySelector("#fila-"+id)

let nombre = fila.querySelector(".input-nombre").value
let cantidad = fila.querySelector(".input-cantidad").value
let precio = fila.querySelector(".input-precio").value

fetch(`/pedidos/editar-producto/${id}/`,{

method:"POST",

headers:{
"X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
"Content-Type":"application/x-www-form-urlencoded"
},

body:`nombre=${nombre}&cantidad=${cantidad}&precio=${precio}`

})

.then(res=>res.json())

},1000)

}


function eliminarProducto(id){

if(!confirm("¿Eliminar producto?")) return

fetch(`/pedidos/eliminar-producto/${id}/`,{

method:"POST",

headers:{
"X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
}

})

.then(res=>res.json())
.then(data=>{

document.querySelector("#fila-"+id).remove()

recalcularTotal()

})

}


function guardarPedido(){

let nuevos = document.querySelectorAll(".producto-nuevo")

let productos = []

nuevos.forEach(function(fila){

let nombre = fila.querySelector(".input-nombre").value.trim()
let cantidad = fila.querySelector(".input-cantidad").value
let precio = fila.querySelector(".input-precio").value

if(nombre !== "" && precio > 0){

productos.push({
nombre:nombre,
cantidad:cantidad,
precio:precio
})

}

})

fetch(`/pedidos/agregar-productos/{{ pedido.id_pedido }}/`,{

method:"POST",

headers:{
"X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
"Content-Type":"application/json"
},

body: JSON.stringify({
productos:productos
})

})

.then(res=>res.json())
.then(data=>{

window.location.href="/menu/"

})

}

</script>

{% endblock %}
